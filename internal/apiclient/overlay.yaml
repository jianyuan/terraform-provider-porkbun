overlay: 1.0.0
info:
  title: Overlay
  version: 0.0.0
actions:
  - target: $.paths['/dns/create/{domain}'].post.responses['200'].content['application/json'].schema.properties.id
    update:
      type: string
      x-go-type: porkbuntypes.StringID
      x-go-type-import:
        path: github.com/jianyuan/terraform-provider-porkbun/internal/porkbuntypes
  - target: $.paths['/domain/get/{domain}'].get.responses['200'].content['application/json'].schema.properties.domain.properties['securityLock', 'whoisPrivacy', 'autoRenew', 'apiAccess', 'notLocal']
    update:
      type: boolean
      x-go-type: porkbuntypes.FlexibleBool
      x-go-type-import:
        path: github.com/jianyuan/terraform-provider-porkbun/internal/porkbuntypes
  - target: $.paths['/domain/getGlue/{domain}'].get.responses['200'].content['application/json'].schema.properties.hosts.items
    update:
      items:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
          - type: object
            properties:
              v4:
                type: array
                items:
                  type: string
              v6:
                type: array
                items:
                  type: string
  - target: $.components.schemas.DnsRecordsResponse.properties.records.items.properties['ttl', 'prio']
    update:
      type: integer
      x-go-type: porkbuntypes.FlexibleInt64
      x-go-type-import:
        path: github.com/jianyuan/terraform-provider-porkbun/internal/porkbuntypes
  - target: $.components.schemas.DomainListAllResponse.properties.domains.items.properties['securityLock', 'whoisPrivacy', 'autoRenew', 'apiAccess', 'notLocal']
    update:
      type: boolean
      x-go-type: porkbuntypes.FlexibleBool
      x-go-type-import:
        path: github.com/jianyuan/terraform-provider-porkbun/internal/porkbuntypes
